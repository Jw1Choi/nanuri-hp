<section id="subVisual" aria-label="갤러리 비주얼" style="--sv-bg:url('./img/clean.jpg')">
  <style>
    /* ===============================
       Scope: #subVisual ONLY — 서브 비주얼 (중앙에서 열리는 리빌 + 타이틀)
       =============================== */
    #subVisual{
      --sv-bg:url('./img/location.jpg');
      --reveal-dur:900ms;
      position:relative;z-index:2;width:100%;height:70vh;min-height:460px;max-height:780px;
      background:#0b0d12 var(--sv-bg) no-repeat center top/cover;overflow:hidden;perspective:900px;
      font-family:Pretendard,"Noto Sans KR",sans-serif;color:#fff;
    }
    #subVisual *{box-sizing:border-box}
    #subVisual::before{
      content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(110deg,rgba(18,22,34,.56) 45%,rgba(28,33,54,.34) 100%);
    }
    #subVisual .sv-reveal{position:absolute;top:0;bottom:0;width:50%;background:#0b0d12;z-index:3;will-change:transform}
    #subVisual .sv-reveal.l{left:0}
    #subVisual .sv-reveal.r{right:0}
    #subVisual.play .sv-reveal.l{animation:svOutL var(--reveal-dur) cubic-bezier(.22,.8,.18,1) forwards}
    #subVisual.play .sv-reveal.r{animation:svOutR var(--reveal-dur) cubic-bezier(.22,.8,.18,1) forwards}
    @keyframes svOutL{to{transform:translateX(-100%)}}
    @keyframes svOutR{to{transform:translateX(100%)}}
    #subVisual .sv-area{
      position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:2;
      width:calc(100% - 80px);max-width:1440px;
    }
    #subVisual .sv-crumb{
      opacity:0;transform:translateY(-18px);margin-bottom:18px;
      transition:opacity .9s cubic-bezier(.22,.9,.39,1.01),transform 1.05s cubic-bezier(.22,.9,.39,1.01);
    }
    #subVisual .sv-crumb ol{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0;padding:0;list-style:none;font-size:1.04rem;opacity:.92}
    #subVisual .sv-crumb li{display:flex;align-items:center}
    #subVisual .sv-crumb li:not(:last-child)::after{content:"›";margin:0 0 0 10px;opacity:.48;font-size:.92em;font-weight:600}
    #subVisual .sv-crumb a{color:#fff;opacity:.83;text-decoration:none;transition:opacity .17s}
    #subVisual .sv-crumb a:hover,#subVisual .sv-crumb a:focus{opacity:1;text-decoration:underline}
    #subVisual .sv-crumb .current{font-weight:700}
    #subVisual .sv-title-box{filter:drop-shadow(0 8px 32px rgba(0,0,0,.11))}
    #subVisual .sv-desc{
      margin:0;font-size:26px;font-weight:400;letter-spacing:-.3px;line-height:1.4;min-height:28px;
      opacity:0;transform:translateY(50px) scale(.97) skewY(2deg) rotateX(10deg);filter:blur(7px) brightness(1.3);
      transition:all 1.25s cubic-bezier(.22,.78,.21,1.02) .14s;
    }
    #subVisual .sv-title{
      margin:14px 0 0;font-size:56px;font-weight:700;line-height:1.28;letter-spacing:-1px;color:#fff;
      opacity:0;transform:translateY(60px) scale(.96) skewY(4deg) rotateX(15deg);filter:blur(4px) brightness(1.4);
      transition:all 1.1s cubic-bezier(.24,.8,.26,1.01);
    }
    #subVisual.in .sv-crumb{opacity:1;transform:none}
    #subVisual.in .sv-desc,#subVisual.in .sv-title{opacity:1;transform:none;filter:none}
    @media (prefers-reduced-motion:reduce){
      #subVisual .sv-reveal{display:none}
      #subVisual .sv-crumb,#subVisual .sv-desc,#subVisual .sv-title{opacity:1;transform:none;filter:none;transition:none}
    }
    @media (max-width:950px){
      #subVisual{height:440px;min-height:0}
      #subVisual .sv-area{bottom:52px;width:calc(100% - 32px)}
      #subVisual .sv-title{font-size:2rem}
      #subVisual .sv-desc{font-size:1.02rem}
      #subVisual .sv-crumb ol{font-size:.92rem}
    }
  </style>
  <div class="sv-reveal l" aria-hidden="true"></div>
  <div class="sv-reveal r" aria-hidden="true"></div>
  <div class="sv-area">
    <nav class="sv-crumb" aria-label="breadcrumb"><ol><li><a href="./index.html">홈</a></li><li><span class="current" aria-current="page">갤러리</span></li></ol></nav>

  </div>

  <script>
    (function () {
      var V = document.getElementById('subVisual');
      if (!V) return;
      var dur = parseInt(getComputedStyle(V).getPropertyValue('--reveal-dur'), 10) || 900;
      requestAnimationFrame(function () { V.classList.add('play'); });
      setTimeout(function () { V.classList.add('in'); }, dur + 40);
      window.addEventListener('scroll', function () {
        var y = window.scrollY || window.pageYOffset;
        if (y < V.offsetHeight) V.style.backgroundPosition = 'center ' + Math.max(0, -y * 0.15) + 'px';
      }, { passive: true });
    })();
  </script>

<section id="galleryBoard" aria-label="갤러리">
  <style>
    /* ===============================
       Scope: #galleryBoard (갤러리) / #glLightbox (확대 보기)
       - data/gallery.json 연동, 카테고리별 제목+사진 묶음 · 탭 · 더 보기 · 라이트박스
       - 라이트박스는 JS가 document.body 로 옮겨 다른 섹션과 겹치지 않게 합니다
       =============================== */
    #galleryBoard{
      --gb-ink:#111827;--gb-muted:#6b7280;--gb-line:rgba(17,24,39,.1);--gb-soft:#f4f6f9;
      --gb-accent:#0f6b3a;--gb-green:#0f6b3a;--gb-green-dark:#033b1e;--gb-green-soft:#eaf4ee;
      --gb-gap:clamp(8px,1.4cqi,16px);--gb-radius:16px;
      font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--gb-ink);background:#fff;padding:clamp(56px,8vw,96px) 20px clamp(80px,10vw,130px);
      container-type:inline-size;-webkit-font-smoothing:antialiased;
    }
    #galleryBoard *{box-sizing:border-box}
    #galleryBoard .gb-wrap{max-width:1200px;margin:0 auto}
    #galleryBoard .gb-head{text-align:center;margin-bottom:clamp(26px,4cqi,40px)}
    #galleryBoard .gb-eyebrow{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--gb-accent)}
    #galleryBoard .gb-head h2{margin:0;font-size:clamp(28px,4.2cqi,42px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
    #galleryBoard .gb-head p{margin:12px 0 0;color:var(--gb-muted);font-size:15.5px;line-height:1.6}
    /* 카테고리 탭: 같은 너비의 칸으로 정렬 (줄 수와 상관없이 표처럼 맞춰집니다) */
    #galleryBoard .gb-tabs{--cols:5;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));border-top:1px solid var(--gb-line);border-left:1px solid var(--gb-line);border-radius:14px;overflow:hidden;margin-bottom:clamp(36px,5cqi,56px)}
    #galleryBoard .gb-tab,#galleryBoard .gb-tab-pad{border-right:1px solid var(--gb-line);border-bottom:1px solid var(--gb-line);background:#fff}
    #galleryBoard .gb-tab{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;height:58px;padding:0 18px;border-top:0;border-left:0;font:inherit;font-size:15px;font-weight:600;color:var(--gb-ink);text-align:left;cursor:pointer;transition:background .2s,color .2s}
    #galleryBoard .gb-tab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #galleryBoard .gb-tab small{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--gb-muted);font-variant-numeric:tabular-nums}
    #galleryBoard .gb-tab:hover{background:var(--gb-green-soft);color:var(--gb-green-dark)}
    #galleryBoard .gb-tab:focus-visible{outline:2px solid var(--gb-accent);outline-offset:-2px}
    #galleryBoard .gb-tab[aria-selected="true"]{background:var(--gb-green);color:#fff}
    #galleryBoard .gb-tab[aria-selected="true"] small{color:rgba(255,255,255,.7)}
    #galleryBoard .gb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gb-gap)}
    /* 카테고리별 묶음: 제목 → 사진 → 다음 카테고리 제목 → 사진 */
    #galleryBoard .gb-list{display:grid;gap:clamp(56px,7cqi,88px)}
    #galleryBoard .gb-sec{scroll-margin-top:110px}
    #galleryBoard .gb-sec-head{display:flex;align-items:flex-end;gap:14px;padding-bottom:16px;margin-bottom:clamp(18px,2.4cqi,26px);border-bottom:2px solid var(--gb-ink)}
    #galleryBoard .gb-sec-no{font-size:14px;font-weight:800;letter-spacing:.12em;color:var(--gb-accent);font-variant-numeric:tabular-nums;padding-bottom:6px}
    #galleryBoard .gb-sec-head h3{margin:0;font-size:clamp(22px,3cqi,30px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
    #galleryBoard .gb-sec-count{margin-left:auto;padding-bottom:5px;font-size:14px;color:var(--gb-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    #galleryBoard .gb-sec-more{display:flex;justify-content:center;margin-top:clamp(20px,3cqi,30px)}
    #galleryBoard .gb-sec-more button{min-width:180px;height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--gb-green);background:#fff;font:inherit;font-size:14.5px;font-weight:700;color:var(--gb-green);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
    #galleryBoard .gb-sec-more button:hover{background:var(--gb-green);border-color:var(--gb-green);color:#fff}
    #galleryBoard .gb-item{position:relative;display:block;width:100%;padding:0;border:0;border-radius:var(--gb-radius);overflow:hidden;background:var(--gb-soft);aspect-ratio:4/3;cursor:zoom-in;opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,.8,.26,1)}
    #galleryBoard .gb-item.is-in{opacity:1;transform:none}
    #galleryBoard .gb-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.22,.8,.26,1)}
    #galleryBoard .gb-item:hover img,#galleryBoard .gb-item:focus-visible img{transform:scale(1.07)}
    #galleryBoard .gb-item:focus-visible{outline:3px solid var(--gb-accent);outline-offset:3px}
    #galleryBoard .gb-cap{position:absolute;inset:auto 0 0 0;padding:40px 16px 14px;text-align:left;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62));opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
    #galleryBoard .gb-item:hover .gb-cap,#galleryBoard .gb-item:focus-visible .gb-cap{opacity:1;transform:none}
    #galleryBoard .gb-cap b{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;opacity:.8;margin-bottom:3px}
    #galleryBoard .gb-cap span{display:block;font-size:14.5px;font-weight:600;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #galleryBoard .gb-more{display:flex;justify-content:center;margin-top:clamp(30px,4cqi,46px)}
    #galleryBoard .gb-more button{min-width:180px;height:52px;padding:0 28px;border-radius:999px;border:1px solid var(--gb-green);background:#fff;font:inherit;font-size:15px;font-weight:700;color:var(--gb-green);cursor:pointer;transition:background .2s,color .2s}
    #galleryBoard .gb-more button:hover{background:var(--gb-green);color:#fff}
    #galleryBoard .gb-more button[hidden]{display:none}
    #galleryBoard .gb-state{grid-column:1/-1;margin:0;padding:80px 20px;text-align:center;color:var(--gb-muted);font-size:15px}
    #galleryBoard .gb-skel{aspect-ratio:4/3;border-radius:var(--gb-radius);background:linear-gradient(90deg,#f1f3f6 0%,#f8f9fb 50%,#f1f3f6 100%);background-size:200% 100%;animation:gbSk 1.2s linear infinite}
    @keyframes gbSk{to{background-position:-200% 0}}
    @container (max-width:1000px){#galleryBoard .gb-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @container (max-width:640px){
      #galleryBoard .gb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      #galleryBoard .gb-tabs{display:flex;gap:6px;overflow-x:auto;border:0;border-radius:0;margin-left:-20px;margin-right:-20px;padding:0 20px 2px;scrollbar-width:none;scroll-snap-type:x proximity}
      #galleryBoard .gb-tabs::-webkit-scrollbar{display:none}
      #galleryBoard .gb-tab-pad{display:none}
      #galleryBoard .gb-tab{flex:0 0 auto;height:40px;padding:0 14px;gap:6px;border:1px solid var(--gb-line);border-radius:999px;font-size:14px;scroll-snap-align:start}
      #galleryBoard .gb-tab small{font-size:12px}
      #galleryBoard .gb-tab[aria-selected="true"]{border-color:var(--gb-green)}
      #galleryBoard .gb-cap{opacity:1;transform:none;padding:28px 10px 9px}
      #galleryBoard .gb-cap b{display:none}
      #galleryBoard .gb-cap span{font-size:12.5px}
      #galleryBoard .gb-sec-head{gap:10px;padding-bottom:12px}
      #galleryBoard .gb-sec-no{font-size:12.5px;padding-bottom:4px}
      #galleryBoard .gb-sec-count{font-size:13px;padding-bottom:3px}
    }
    @media (prefers-reduced-motion:reduce){#galleryBoard .gb-item{opacity:1;transform:none;transition:none}}

    /* ---------- 라이트박스 ---------- */
    #glLightbox{position:fixed;inset:0;z-index:99999;display:none;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#fff}
    #glLightbox.is-open{display:block}
    #glLightbox *{box-sizing:border-box}
    #glLightbox .lb-dim{position:absolute;inset:0;background:rgba(8,10,16,.92);backdrop-filter:blur(4px);animation:lbFade .25s ease}
    #glLightbox .lb-stage{position:absolute;inset:64px 84px 104px;display:grid;place-items:center}
    #glLightbox .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:lbZoom .35s cubic-bezier(.22,.8,.26,1)}
    #glLightbox .lb-top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    #glLightbox .lb-count{font-size:14px;opacity:.75;font-variant-numeric:tabular-nums}
    #glLightbox .lb-btn{width:48px;height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s}
    #glLightbox .lb-btn:hover{background:#0f6b3a;border-color:#0f6b3a}
    #glLightbox .lb-btn svg{width:22px;height:22px}
    #glLightbox .lb-prev,#glLightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%)}
    #glLightbox .lb-prev{left:18px}
    #glLightbox .lb-next{right:18px}
    #glLightbox .lb-bottom{position:absolute;left:0;right:0;bottom:0;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 24px 22px;text-align:center}
    #glLightbox .lb-cat{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:#9fd6b0}
    #glLightbox .lb-cap{font-size:16px;line-height:1.55;max-width:760px}
    @keyframes lbFade{from{opacity:0}}
    @keyframes lbZoom{from{opacity:0;transform:scale(.96)}}
    @media (max-width:640px){
      #glLightbox .lb-stage{inset:56px 0 110px}
      #glLightbox .lb-stage img{border-radius:0}
      #glLightbox .lb-prev,#glLightbox .lb-next{top:auto;bottom:24px;transform:none;width:44px;height:44px}
      #glLightbox .lb-bottom{padding:12px 70px 20px}
      #glLightbox .lb-cap{font-size:14px}
    }
  </style>

    <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 18.5 16 12 9.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="lb-bottom"><span class="lb-cat" id="lbCat"></span><p class="lb-cap" id="lbCap"></p></div>
  </div>

  <script>
    (function () {
      var S = document.getElementById('galleryBoard');
      if (!S) return;
      var tabsEl = S.querySelector('#gbTabs');
      var listEl = S.querySelector('#gbList');
      var LB = S.querySelector('#glLightbox');
      document.body.appendChild(LB);
      var lbImg = LB.querySelector('#lbImg'), lbCap = LB.querySelector('#lbCap'), lbCat = LB.querySelector('#lbCat'), lbCount = LB.querySelector('#lbCount');

      /* 전체 보기에서는 카테고리마다 8장, 한 카테고리만 볼 때는 16장씩 보여주고 「더 보기」로 늘립니다 */
      var STEP_ALL = 8, STEP_ONE = 16, ALL = 'all';
      var cats = [], items = [], groups = [], list = [], cur = ALL, limits = {}, idx = 0, lastFocus = null;

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function catName(id) { for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i].name; return '기타'; }
      function src(i) { return i.src || ('./' + i.path); }
      function thumb(i) { return i.thumbSrc || (i.thumb ? './' + i.thumb : src(i)); }
      function step() { return cur === ALL ? STEP_ALL : STEP_ONE; }

      var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
      }, { rootMargin: '0px 0px -40px 0px' }) : null;

      /* 관리자에서 정한 카테고리 순서대로 묶습니다. 사진이 없는 카테고리는 건너뜁니다. */
      function buildGroups() {
        var map = {};
        items.forEach(function (i) { (map[i.cat] = map[i.cat] || []).push(i); });
        groups = cats.filter(function (c) { return map[c.id]; }).map(function (c) { return { id: c.id, name: c.name, items: map[c.id] }; });
        var known = {};
        cats.forEach(function (c) { known[c.id] = 1; });
        var etc = items.filter(function (i) { return !known[i.cat]; });
        if (etc.length) groups.push({ id: '__etc', name: '기타', items: etc });
      }

      function drawTabs() {
        var tabs = [{ id: ALL, name: '전체', n: items.length }].concat(
          groups.map(function (g) { return { id: g.id, name: g.name, n: g.items.length }; })
        );
        tabsEl.innerHTML = tabs.map(function (t) {
          return '<button type="button" class="gb-tab" role="tab" data-cat="' + esc(t.id) + '" aria-selected="' + (t.id === cur) + '" title="' + esc(t.name) + '"><span>' + esc(t.name) + '</span><small>' + t.n + '</small></button>';
        }).join('');
        layoutTabs();
      }

      /* 화면 폭에 맞춰 한 줄 칸 수를 정하고, 마지막 줄 빈칸을 채워 표 모양을 맞춥니다 */
      function layoutTabs() {
        Array.prototype.slice.call(tabsEl.querySelectorAll('.gb-tab-pad')).forEach(function (n) { n.remove(); });
        var n = tabsEl.querySelectorAll('.gb-tab').length;
        if (!n) return;
        var w = tabsEl.parentNode.clientWidth;
        var max = w > 1000 ? 5 : w > 640 ? 3 : 0;
        if (!max) return;                       /* 모바일은 가로 스크롤 */
        var rows = Math.ceil(n / max);
        var cols = Math.ceil(n / rows);         /* 줄마다 칸 수가 고르게 */
        tabsEl.style.setProperty('--cols', cols);
        for (var k = n; k < rows * cols; k++) {
          var pad = document.createElement('span');
          pad.className = 'gb-tab-pad';
          pad.setAttribute('aria-hidden', 'true');
          tabsEl.appendChild(pad);
        }
      }
      var rt;
      window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layoutTabs, 120); });

      function tile(it, k, gid) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'gb-item';
        b.setAttribute('data-g', gid);
        b.setAttribute('data-i', String(k));
        b.setAttribute('aria-label', (it.caption || catName(it.cat) || '사진') + ' 크게 보기');
        b.style.transitionDelay = (k % 8) * 0.035 + 's';
        b.innerHTML = '<img src="' + esc(thumb(it)) + '" alt="' + esc(it.caption || catName(it.cat)) + '" loading="lazy" decoding="async">' +
          (it.caption ? '<span class="gb-cap"><span>' + esc(it.caption) + '</span></span>' : '');
        if (io) io.observe(b); else b.classList.add('is-in');
        return b;
      }

      function fillSection(sec, g, append) {
        var grid = sec.querySelector('.gb-grid');
        var more = sec.querySelector('.gb-sec-more button');
        var lim = limits[g.id] || step();
        var from = append ? grid.children.length : 0;
        if (!append) grid.innerHTML = '';
        g.items.slice(from, lim).forEach(function (it, k) { grid.appendChild(tile(it, from + k, g.id)); });
        var rest = g.items.length - Math.min(lim, g.items.length);
        more.hidden = rest <= 0;
        more.textContent = '더 보기 (+' + rest + ')';
      }

      function drawList() {
        listEl.innerHTML = '';
        if (!groups.length) {
          listEl.innerHTML = '<p class="gb-state">아직 등록된 사진이 없습니다.</p>';
          return;
        }
        var shown = cur === ALL ? groups : groups.filter(function (g) { return g.id === cur; });
        shown.forEach(function (g) {
          var no = groups.indexOf(g) + 1;
          var sec = document.createElement('section');
          sec.className = 'gb-sec';
          sec.id = 'gbSec-' + g.id;
          sec.setAttribute('aria-label', g.name);
          sec.innerHTML =
            '<div class="gb-sec-head"><span class="gb-sec-no">' + (no < 10 ? '0' + no : no) + '</span>' +
            '<h3>' + esc(g.name) + '</h3><span class="gb-sec-count">' + g.items.length + '장</span></div>' +
            '<div class="gb-grid"></div>' +
            '<div class="gb-sec-more"><button type="button" hidden></button></div>';
          listEl.appendChild(sec);
          fillSection(sec, g, false);
          sec.querySelector('.gb-sec-more button').addEventListener('click', function () {
            limits[g.id] = (limits[g.id] || step()) + step();
            fillSection(sec, g, true);
          });
        });
      }

      function select(id) {
        cur = id; limits = {};
        Array.prototype.forEach.call(tabsEl.querySelectorAll('.gb-tab'), function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-cat') === id)); });
        var h = id === ALL ? '' : '#cat=' + encodeURIComponent(id);
        if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
        drawList();
      }

      /* 라이트박스 */
      function show(i) {
        if (!list.length) return;
        idx = (i + list.length) % list.length;
        var it = list[idx];
        lbImg.src = src(it);
        lbImg.alt = it.caption || catName(it.cat);
        lbImg.style.animation = 'none'; void lbImg.offsetWidth; lbImg.style.animation = '';
        lbCap.textContent = it.caption || '';
        lbCat.textContent = catName(it.cat);
        lbCount.textContent = (idx + 1) + ' / ' + list.length;
        var nx = list[(idx + 1) % list.length];
        if (nx) { var pre = new Image(); pre.src = src(nx); }
      }
      function open(i) {
        lastFocus = document.activeElement;
        LB.classList.add('is-open');
        LB.setAttribute('aria-hidden', 'false');
        document.documentElement.style.overflow = 'hidden';
        show(i);
        LB.querySelector('[data-close].lb-btn').focus();
      }
      function close() {
        LB.classList.remove('is-open');
        LB.setAttribute('aria-hidden', 'true');
        document.documentElement.style.overflow = '';
        lbImg.removeAttribute('src');
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      tabsEl.addEventListener('click', function (e) {
        var t = e.target.closest('.gb-tab');
        if (t) select(t.getAttribute('data-cat'));
      });
      listEl.addEventListener('click', function (e) {
        var b = e.target.closest('.gb-item');
        if (!b) return;
        var gid = b.getAttribute('data-g');
        for (var i = 0; i < groups.length; i++) if (groups[i].id === gid) list = groups[i].items;
        open(Number(b.getAttribute('data-i')));
      });
      LB.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) close(); });
      LB.querySelector('#lbPrev').addEventListener('click', function () { show(idx - 1); });
      LB.querySelector('#lbNext').addEventListener('click', function () { show(idx + 1); });
      document.addEventListener('keydown', function (e) {
        if (!LB.classList.contains('is-open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') show(idx - 1);
        else if (e.key === 'ArrowRight') show(idx + 1);
      });
      var sx = 0;
      LB.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
      LB.addEventListener('touchend', function (e) {
        var d = e.changedTouches[0].clientX - sx;
        if (Math.abs(d) > 50) show(idx + (d < 0 ? 1 : -1));
      });

      fetch('./data/gallery.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (r.status === 404) return {}; if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          cats = Array.isArray(d.categories) ? d.categories : [];
          items = Array.isArray(d.items) ? d.items : [];
          var m = location.hash.match(/^#cat=(.+)$/);
          var want = m ? decodeURIComponent(m[1]) : ALL;
          buildGroups();
          cur = want === ALL || groups.some(function (g) { return g.id === want; }) ? want : ALL;
          drawTabs();
          drawList();
        })
        .catch(function () { listEl.innerHTML = '<p class="gb-state">갤러리를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>'; });
    })();
  </script>
</section>

  <div id="footer_template"></div>
</body>
<script src="./js/jquery-1.11.0.min.js"></script>
<script src="./js/validation1.js"></script>
<script src="./js/main.js"></script>
<script src="./js/footer.js"></script>

</html>
