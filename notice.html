<section id="subVisual" aria-label="공지사항 비주얼" style="--sv-bg:url('./img/page-3.jpg')">
  <style>
    /* ===============================
       Scope: #subVisual ONLY — 서브 비주얼 (중앙에서 열리는 리빌 + 타이틀)
       =============================== */
    #subVisual{
      --sv-bg:url('./img/location.jpg');
      --reveal-dur:900ms;
      position:relative;z-index:2;width:100%;height:70vh;min-height:460px;max-height:780px;
      background:#0b0d12 var(--sv-bg) no-repeat center top/cover;overflow:hidden;perspective:900px;
      font-family:Pretendard,"Noto Sans KR",sans-serif;color:#fff;
    }
    #subVisual *{box-sizing:border-box}
    #subVisual::before{
      content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(110deg,rgba(18,22,34,.56) 45%,rgba(28,33,54,.34) 100%);
    }
    #subVisual .sv-reveal{position:absolute;top:0;bottom:0;width:50%;background:#0b0d12;z-index:3;will-change:transform}
    #subVisual .sv-reveal.l{left:0}
    #subVisual .sv-reveal.r{right:0}
    #subVisual.play .sv-reveal.l{animation:svOutL var(--reveal-dur) cubic-bezier(.22,.8,.18,1) forwards}
    #subVisual.play .sv-reveal.r{animation:svOutR var(--reveal-dur) cubic-bezier(.22,.8,.18,1) forwards}
    @keyframes svOutL{to{transform:translateX(-100%)}}
    @keyframes svOutR{to{transform:translateX(100%)}}
    #subVisual .sv-area{
      position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:2;
      width:calc(100% - 80px);max-width:1440px;
    }
    #subVisual .sv-crumb{
      opacity:0;transform:translateY(-18px);margin-bottom:18px;
      transition:opacity .9s cubic-bezier(.22,.9,.39,1.01),transform 1.05s cubic-bezier(.22,.9,.39,1.01);
    }
    #subVisual .sv-crumb ol{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0;padding:0;list-style:none;font-size:1.04rem;opacity:.92}
    #subVisual .sv-crumb li{display:flex;align-items:center}
    #subVisual .sv-crumb li:not(:last-child)::after{content:"›";margin:0 0 0 10px;opacity:.48;font-size:.92em;font-weight:600}
    #subVisual .sv-crumb a{color:#fff;opacity:.83;text-decoration:none;transition:opacity .17s}
    #subVisual .sv-crumb a:hover,#subVisual .sv-crumb a:focus{opacity:1;text-decoration:underline}
    #subVisual .sv-crumb .current{font-weight:700}
    #subVisual .sv-title-box{filter:drop-shadow(0 8px 32px rgba(0,0,0,.11))}
    #subVisual .sv-desc{
      margin:0;font-size:26px;font-weight:400;letter-spacing:-.3px;line-height:1.4;min-height:28px;
      opacity:0;transform:translateY(50px) scale(.97) skewY(2deg) rotateX(10deg);filter:blur(7px) brightness(1.3);
      transition:all 1.25s cubic-bezier(.22,.78,.21,1.02) .14s;
    }
    #subVisual .sv-title{
      margin:14px 0 0;font-size:56px;font-weight:700;line-height:1.28;letter-spacing:-1px;color:#fff;
      opacity:0;transform:translateY(60px) scale(.96) skewY(4deg) rotateX(15deg);filter:blur(4px) brightness(1.4);
      transition:all 1.1s cubic-bezier(.24,.8,.26,1.01);
    }
    #subVisual.in .sv-crumb{opacity:1;transform:none}
    #subVisual.in .sv-desc,#subVisual.in .sv-title{opacity:1;transform:none;filter:none}
    @media (prefers-reduced-motion:reduce){
      #subVisual .sv-reveal{display:none}
      #subVisual .sv-crumb,#subVisual .sv-desc,#subVisual .sv-title{opacity:1;transform:none;filter:none;transition:none}

      #subVisual .sv-area{bottom:52px;width:calc(100% - 32px)}

  <script>
    (function () {
      var V = document.getElementById('subVisual');
      if (!V) return;
      var dur = parseInt(getComputedStyle(V).getPropertyValue('--reveal-dur'), 10) || 900;
      requestAnimationFrame(function () { V.classList.add('play'); });
      setTimeout(function () { V.classList.add('in'); }, dur + 40);
      window.addEventListener('scroll', function () {
        var y = window.scrollY || window.pageYOffset;
        if (y < V.offsetHeight) V.style.backgroundPosition = 'center ' + Math.max(0, -y * 0.15) + 'px';

<section id="noticeBoard" aria-label="공지사항 게시판">
  <style>
    /* ===============================
       Scope: #noticeBoard ONLY — 공지사항 게시판 (data/notice.json 연동)
       =============================== */
    #noticeBoard{
      --nb-ink:#111827;--nb-muted:#6b7280;--nb-line:rgba(17,24,39,.1);--nb-soft:#f4f6f9;
      --nb-accent:#0b4a8b;--nb-accent-soft:#e8f0fa;--nb-radius:18px;
      font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--nb-ink);background:#fff;padding:clamp(56px,8vw,96px) 20px clamp(80px,10vw,130px);
      container-type:inline-size;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    #noticeBoard *{box-sizing:border-box}
    #noticeBoard .nb-wrap{max-width:1200px;margin:0 auto}
    #noticeBoard .nb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 28px;flex-wrap:wrap;margin-bottom:26px}
    #noticeBoard .nb-eyebrow{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--nb-accent)}
    #noticeBoard .nb-head h2{margin:0;font-size:clamp(28px,4.2cqi,42px);font-weight:800;letter-spacing:-.035em;line-height:1.2}
    #noticeBoard .nb-head p{margin:10px 0 0;color:var(--nb-muted);font-size:15.5px;line-height:1.6}
    #noticeBoard .nb-tools{display:flex;align-items:center;gap:10px}
    #noticeBoard .nb-search{display:flex;align-items:center;gap:8px;height:48px;padding:0 8px 0 18px;border:1px solid var(--nb-line);border-radius:999px;background:#fff;min-width:min(300px,100%);transition:border-color .2s,box-shadow .2s}
    #noticeBoard .nb-search:focus-within{border-color:var(--nb-accent);box-shadow:0 0 0 4px var(--nb-accent-soft)}
    #noticeBoard .nb-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:inherit}
    #noticeBoard .nb-search svg{width:19px;height:19px;color:var(--nb-muted);flex:0 0 auto;margin-right:6px}
    #noticeBoard .nb-view{display:flex;padding:4px;border-radius:999px;background:var(--nb-soft)}
    #noticeBoard .nb-view button{width:40px;height:40px;border:0;border-radius:999px;background:transparent;color:var(--nb-muted);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
    #noticeBoard .nb-view button svg{width:18px;height:18px}
    #noticeBoard .nb-view button[aria-pressed="true"]{background:#fff;color:var(--nb-ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    #noticeBoard .nb-count{display:flex;justify-content:space-between;align-items:center;padding:0 0 14px;border-bottom:2px solid var(--nb-ink);font-size:14px;color:var(--nb-muted)}
    #noticeBoard .nb-count b{color:var(--nb-accent);font-weight:700}

    /* 카드형 */
    #noticeBoard .nb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4cqi,28px);padding-top:28px}
    #noticeBoard .nb-card{display:flex;flex-direction:column;color:inherit;text-decoration:none;border:1px solid var(--nb-line);border-radius:var(--nb-radius);overflow:hidden;background:#fff;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;opacity:0;transform:translateY(16px);animation:nbIn .6s cubic-bezier(.22,.8,.26,1) forwards}
    #noticeBoard .nb-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(17,24,39,.1);border-color:rgba(17,24,39,.14)}
    #noticeBoard .nb-card:focus-visible{outline:2px solid var(--nb-accent);outline-offset:3px}
    @keyframes nbIn{to{opacity:1;transform:none}}
    #noticeBoard .nb-thumb{position:relative;aspect-ratio:16/10;background:var(--nb-soft);overflow:hidden}
    #noticeBoard .nb-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
    #noticeBoard .nb-card:hover .nb-thumb img{transform:scale(1.05)}
    #noticeBoard .nb-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;background:linear-gradient(135deg,#0b4a8b 0%,#1c2136 100%)}
    #noticeBoard .nb-ph b{font-size:13px;letter-spacing:.22em;opacity:.7;font-weight:700}
    #noticeBoard .nb-ph span{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
    #noticeBoard .nb-badge{position:absolute;top:14px;left:14px;z-index:1;display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#e11d2e;color:#fff;font-size:12.5px;font-weight:700}
    #noticeBoard .nb-ext{position:absolute;top:14px;right:14px;z-index:1;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:14px;color:var(--nb-ink)}
    #noticeBoard .nb-text{display:flex;flex-direction:column;gap:9px;padding:20px 22px 22px;flex:1}
    #noticeBoard .nb-title{margin:0;font-size:18px;font-weight:700;line-height:1.45;letter-spacing:-.02em;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    #noticeBoard .nb-excerpt{margin:0;font-size:14.5px;line-height:1.65;color:var(--nb-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    #noticeBoard .nb-date{margin-top:auto;padding-top:8px;font-size:13.5px;color:var(--nb-muted);font-variant-numeric:tabular-nums}

    /* 목록형 */
    #noticeBoard .nb-list{list-style:none;margin:0;padding:0}
    #noticeBoard .nb-row a{display:grid;grid-template-columns:80px minmax(0,1fr) 120px;gap:18px;align-items:center;padding:20px 8px;border-bottom:1px solid var(--nb-line);color:inherit;text-decoration:none;transition:background .2s}
    #noticeBoard .nb-row a:hover{background:#fafbfc}
    #noticeBoard .nb-row a:hover .nb-rt{color:var(--nb-accent)}
    #noticeBoard .nb-row.is-pin a{background:#f8fafd}
    #noticeBoard .nb-no{text-align:center;font-size:14px;color:var(--nb-muted);font-variant-numeric:tabular-nums}
    #noticeBoard .nb-no .nb-pin{display:inline-flex;height:24px;padding:0 9px;align-items:center;border-radius:999px;background:#e11d2e;color:#fff;font-size:12px;font-weight:700}
    #noticeBoard .nb-rt{font-size:16.5px;font-weight:600;letter-spacing:-.015em;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
    #noticeBoard .nb-rt em{font-style:normal;margin-left:6px;color:var(--nb-muted);font-size:.9em}
    #noticeBoard .nb-rd{text-align:center;font-size:14px;color:var(--nb-muted);font-variant-numeric:tabular-nums}

    #noticeBoard .nb-state{padding:80px 20px;text-align:center;color:var(--nb-muted);font-size:15px}
    #noticeBoard .nb-skel{height:340px;border-radius:var(--nb-radius);background:linear-gradient(90deg,#f1f3f6 0%,#f8f9fb 50%,#f1f3f6 100%);background-size:200% 100%;animation:nbSk 1.2s linear infinite}
    @keyframes nbSk{to{background-position:-200% 0}}

    #noticeBoard .nb-pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:clamp(36px,5cqi,56px);flex-wrap:wrap}
    #noticeBoard .nb-pager button{min-width:42px;height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--nb-line);background:#fff;font:inherit;font-size:14.5px;color:inherit;cursor:pointer;transition:background .2s,border-color .2s}
    #noticeBoard .nb-pager button:hover:not(:disabled){border-color:var(--nb-ink)}
    #noticeBoard .nb-pager button.is-on{background:var(--nb-ink);border-color:var(--nb-ink);color:#fff}
    #noticeBoard .nb-pager button:disabled{opacity:.3;cursor:default}

    @container (max-width:960px){#noticeBoard .nb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @container (max-width:640px){
      #noticeBoard .nb-grid{grid-template-columns:1fr}
      #noticeBoard .nb-tools{width:100%}
      #noticeBoard .nb-search{flex:1;min-width:0}
      #noticeBoard .nb-row a{grid-template-columns:52px minmax(0,1fr);gap:12px;padding:16px 4px}
      #noticeBoard .nb-rt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      #noticeBoard .nb-rd{grid-column:2;text-align:left;margin-top:-8px;font-size:13px}
    }
    @media (prefers-reduced-motion:reduce){#noticeBoard .nb-card{animation:none;opacity:1;transform:none}}
  </style>

  <div class="nb-wrap">
    <div class="nb-head">
      <div>
        <p class="nb-eyebrow">NOTICE</p>
        <h2>공지사항</h2>
        <p>나누리사회적협동조합의 새로운 소식과 안내를 전해드립니다.</p>
      </div>
      <div class="nb-tools">
        <label class="nb-search">
          <input type="search" id="nbSearch" placeholder="제목·내용 검색" aria-label="공지사항 검색" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </label>
        <div class="nb-view" role="group" aria-label="보기 방식">
          <button type="button" data-view="card" aria-pressed="true" aria-label="카드형으로 보기">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="목록형으로 보기">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="nb-count"><span>전체 <b id="nbTotal">0</b>건</span><span id="nbPageInfo"></span></div>
    <div id="nbBody"><div class="nb-grid"><div class="nb-skel"></div><div class="nb-skel"></div><div class="nb-skel"></div></div></div>
    <nav class="nb-pager" id="nbPager" aria-label="페이지"></nav>
    <noscript><p class="nb-state">공지사항을 보려면 자바스크립트를 켜 주세요.</p></noscript>
  </div>

  <script>
    (function () {
      var S = document.getElementById('noticeBoard');
      if (!S) return;
      var body = S.querySelector('#nbBody');
      var pager = S.querySelector('#nbPager');
      var input = S.querySelector('#nbSearch');
      var totalEl = S.querySelector('#nbTotal');
      var infoEl = S.querySelector('#nbPageInfo');
      var viewBtns = S.querySelectorAll('.nb-view button');
      var PER = { card: 9, list: 15 };
      var all = [], shown = [], page = 1, view = 'card';

      try { view = localStorage.getItem('nanuriNoticeView') === 'list' ? 'list' : 'card'; } catch (e) {}

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function dot(d) { return String(d || '').replace(/-/g, '.'); }
      function ext(n) { return !!(n.openExternal && n.externalLink); }
      function attrs(n) { return 'href="' + esc(n.link || ('./' + n.slug + '.html')) + '"' + (ext(n) ? ' target="_blank" rel="noopener noreferrer"' : ''); }

      function card(n, i) {
        var thumb = n.img
          ? '<img src="' + esc(n.img) + '" alt="" loading="lazy" decoding="async">'
          : '<div class="nb-ph"><b>NANURI</b><span>NOTICE</span></div>';
        return '<a class="nb-card" ' + attrs(n) + ' style="animation-delay:' + (i * 0.05) + 's">' +
          '<div class="nb-thumb">' + thumb + (n.pinned ? '<span class="nb-badge">중요</span>' : '') + (ext(n) ? '<span class="nb-ext" aria-label="외부 링크">↗</span>' : '') + '</div>' +
          '<div class="nb-text"><h3 class="nb-title">' + esc(n.title) + '</h3>' +
          (n.excerpt ? '<p class="nb-excerpt">' + esc(n.excerpt) + '</p>' : '') +
          '<time class="nb-date" datetime="' + esc(n.date) + '">' + dot(n.date) + '</time></div></a>';
      }

      function row(n, no) {
        return '<li class="nb-row' + (n.pinned ? ' is-pin' : '') + '"><a ' + attrs(n) + '>' +
          '<span class="nb-no">' + (n.pinned ? '<span class="nb-pin">중요</span>' : no) + '</span>' +
          '<span class="nb-rt">' + esc(n.title) + (ext(n) ? '<em>↗</em>' : '') + '</span>' +
          '<time class="nb-rd" datetime="' + esc(n.date) + '">' + dot(n.date) + '</time></a></li>';
      }

      function draw(scroll) {
        var per = PER[view];
        var pages = Math.max(1, Math.ceil(shown.length / per));
        if (page > pages) page = pages;
        var slice = shown.slice((page - 1) * per, page * per);
        totalEl.textContent = shown.length;
        infoEl.textContent = shown.length ? page + ' / ' + pages + ' 페이지' : '';

        if (!shown.length) {
          body.innerHTML = '<p class="nb-state">' + (all.length ? '검색 결과가 없습니다.' : '등록된 공지사항이 없습니다.') + '</p>';
        } else if (view === 'card') {
          body.innerHTML = '<div class="nb-grid">' + slice.map(card).join('') + '</div>';
        } else {
          var normal = shown.filter(function (n) { return !n.pinned; });
          body.innerHTML = '<ul class="nb-list">' + slice.map(function (n) {
            return row(n, normal.length - normal.indexOf(n));
          }).join('') + '</ul>';
        }

        Array.prototype.forEach.call(viewBtns, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === view)); });

        pager.innerHTML = '';
        if (pages > 1) {
          var btn = function (label, p, on, dis, aria) {
            var b = document.createElement('button');
            b.type = 'button'; b.textContent = label;
            if (aria) b.setAttribute('aria-label', aria);
            if (on) { b.className = 'is-on'; b.setAttribute('aria-current', 'page'); }
            b.disabled = !!dis;
            b.addEventListener('click', function () { page = p; syncHash(); draw(true); });
            pager.appendChild(b);
          };
          btn('‹', page - 1, false, page === 1, '이전 페이지');
          var from = Math.max(1, page - 2), to = Math.min(pages, from + 4);
          from = Math.max(1, to - 4);
          for (var i = from; i <= to; i++) btn(String(i), i, i === page);
          btn('›', page + 1, false, page === pages, '다음 페이지');
        }
        if (scroll) S.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function syncHash() {
        var h = page > 1 ? '#p' + page : '';
        if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
      }

      function filter() {
        var q = input.value.trim().toLowerCase();
        shown = !q ? all : all.filter(function (n) { return (n.title + ' ' + (n.excerpt || '')).toLowerCase().indexOf(q) > -1; });
      }

      var t;
      input.addEventListener('input', function () {
        clearTimeout(t);
        t = setTimeout(function () { filter(); page = 1; syncHash(); draw(false); }, 120);
      });
      Array.prototype.forEach.call(viewBtns, function (b) {
        b.addEventListener('click', function () {
          view = b.getAttribute('data-view');
          try { localStorage.setItem('nanuriNoticeView', view); } catch (e) {}
          page = 1; syncHash(); draw(false);
        });
      });

      var m = location.hash.match(/^#p(\d+)$/);
      if (m) page = Number(m[1]);

      fetch('./data/notice.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (r.status === 404) return { items: [] }; if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          all = (d && Array.isArray(d.items) ? d.items : []).filter(function (n) { return n && !n.hidden; });
          filter(); draw(false);
        })
        .catch(function () { body.innerHTML = '<p class="nb-state">공지사항을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>'; });
    })();
  </script>
</section>

  <div id="footer_template"></div>
</body>
