    .bg {

      background-size: cover;

    .swiper-slide-active .bg {

    .mv_tit {

      opacity: 0;

      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .swiper-slide-active .mv_btn {
      opacity: 1;
      pointer-events: auto
    }

    .mv_btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .15);
      transform: translateX(-100%);
      transition: transform .4s;
    }

        opacity: 0

      100% {

        opacity: 1

    .wave_anim.custom .wave:nth-child(1) {
      animation-delay: .15s

      /* ▼ 중앙에서 바깥쪽으로 '열리며' 배경이 나타나는 리빌 패널 */
      .sub-visual__wrap .reveal {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: #0b0d12;
        z-index: 0;
        transform: translateX(0);
        will-change: transform;
      }

      .sub-visual__wrap .reveal.l {
        left: 0;
      }

      .sub-visual__wrap .reveal.r {
        right: 0;
      }

      .sub-visual__wrap.play .reveal.l {
        animation: revealOutL var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      .sub-visual__wrap.play .reveal.r {
        animation: revealOutR var(--reveal-dur) cubic-bezier(.22, .8, .18, 1) forwards;
      }

      @keyframes revealOutL {
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes revealOutR {
        to {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion:reduce) {
        .sub-visual__wrap.play .reveal.l {
          animation: none;
          transform: translateX(-100%);
        }

        .sub-visual__wrap.play .reveal.r {

    <script>
      /* ───── 애니메이션 + 패럴럭스 + 브레드크럼 정렬 ───── */
      document.addEventListener('DOMContentLoaded', () => {
        const titleBox = document.querySelector('.sub-visual__title');
        const breadcrumb = document.querySelector('.breadcrumb-nav');
        const visual = document.querySelector('.sub-visual__wrap.visual-01');

        // ① 배경 양갈래 리빌 시작(중앙 → 바깥)
        visual.classList.add('play');

        // 리빌 길이( CSS 변수 --reveal-dur )를 읽어서 동기화
        const dur = parseInt(getComputedStyle(visual).getPropertyValue('--reveal-dur')) || 900;

        // ② 리빌 종료 후 텍스트 등장
        setTimeout(() => {
          titleBox.classList.add('in');
          breadcrumb.classList.add('in');
          alignBreadcrumb();
        }, dur + 40);

        // ③ 스크롤 패럴럭스
        window.addEventListener('scroll', () => {
          const scrolled = window.scrollY || window.pageYOffset;
          if (visual) {
            visual.style.backgroundPosition = `center ${Math.max(0, -scrolled * 0.15)}px`;
          }
        });

        // ④ 브레드크럼을 타이틀 바로 위에 놓음
        function alignBreadcrumb() {
          const areaRect = document.querySelector('.sub-visual__area').getBoundingClientRect();
          const wrapRect = visual.getBoundingClientRect();
          const nav = breadcrumb;
          const gap = 12;
          nav.style.bottom = (wrapRect.bottom - areaRect.top + gap * -1) + 'px';
        }
        window.addEventListener('resize', alignBreadcrumb);
      });
    </script>

      <button id="h-load-more-btn" class="h-load-more" type="button" hidden>더 보기 <span class="lm-arrow">▼</span></button>
    </div>
  </div>

  <style>
    #h-service-banners *,
    #h-service-banners *::before,
    #h-service-banners *::after{ box-sizing:border-box; }

    #h-service-banners{
      --bnz-bg:#ffffff;
      --bnz-blue:#1c4ed8;
      --bnz-ink:#0f1f3d;
      --bnz-ink-dim:#5b6b86;
      --bnz-line:#e2e8f5;
      --bnz-card-acc:#cfe0ff;

      font-family:'Pretendard',-apple-system,system-ui,sans-serif;
      padding:90px 20px;
      margin:0 auto;
      text-align:center;
      background:var(--bnz-bg);
    }

    #h-service-banners .h-container{ max-width:1120px; margin:0 auto; }

    #h-service-banners .h-main-title{
      font-size:32px; font-weight:700; margin-bottom:48px; line-height:1.45;
      color:var(--bnz-ink); letter-spacing:-0.02em;
    }
    #h-service-banners .h-main-title .g{ color:var(--bnz-blue); }

    #h-service-banners .h-banner-wrapper{
      display:grid; grid-template-columns:repeat(3,1fr);
      align-items:stretch; gap:24px; margin:0 auto;
    }

    #h-service-banners .h-banner{
      position:relative; min-height:440px; border-radius:20px; overflow:hidden;
      display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
      text-align:left; color:#fff;
      box-shadow:0 14px 34px rgba(16,40,90,.12);
      transition:transform .45s ease, box-shadow .45s ease;
      cursor:pointer; outline:none; text-decoration:none;
      -webkit-tap-highlight-color:transparent; user-select:none;
      background:#0b1a4a;
    }
    #h-service-banners .h-banner::before{
      content:""; position:absolute; inset:0;
      background-image:var(--h-bg); background-size:cover; background-position:center;
      transition:transform 600ms cubic-bezier(.2,.8,.2,1); will-change:transform; z-index:0;
    }
    #h-service-banners .h-banner::after{
      content:""; position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(11,26,74,.22) 0%, rgba(11,26,74,.50) 52%, rgba(8,20,58,.90) 100%),
        linear-gradient(0deg, rgb(0 0 0 / 30%) 0%, rgb(255 255 255 / 30%) 100%);
      pointer-events:none; z-index:1;
    }

    #h-service-banners .h-num{
      position:absolute; top:26px; left:26px; z-index:4;
      font-size:34px; font-weight:400; line-height:1; letter-spacing:1px; color:#fff;
    }
    #h-service-banners .h-num::after{
      content:""; display:block; width:26px; height:2px;
      background:var(--bnz-card-acc); margin-top:10px;
    }

    #h-service-banners .h-banner-content{ position:relative; z-index:2; width:100%; padding:26px; }
    #h-service-banners .h-dummy-title{
      font-size:24px; font-weight:700; margin-bottom:10px; letter-spacing:-0.02em;
      line-height:1.3; word-break:keep-all; color:#fff;
    }
    #h-service-banners .h-cat{
      display:inline-block; font-size:12px; font-weight:700; letter-spacing:2px;
      color:var(--bnz-card-acc); margin-bottom:14px;
    }
    #h-service-banners .h-banner-text{
      font-size:14px; color:rgba(255,255,255,.88); line-height:1.6;
      word-break:keep-all; letter-spacing:-0.01em; margin-bottom:18px;
    }
    #h-service-banners .h-more{
      display:inline-flex; align-items:center; gap:8px;
      font-size:13px; font-weight:600; letter-spacing:.3px; color:var(--bnz-card-acc);
    }
    #h-service-banners .h-more .arrow{ transition:transform .3s; }

    @media (hover:hover){
      #h-service-banners .h-banner:hover{ transform:translateY(-4px); box-shadow:0 22px 46px rgba(28,78,216,.26); }
      #h-service-banners .h-banner:hover::before{ transform:scale(1.08); }
      #h-service-banners .h-banner:hover .h-more .arrow{ transform:translateX(4px); }
    }
    #h-service-banners .h-banner:focus-visible{ box-shadow:0 0 0 3px rgba(28,78,216,.45); }

    #h-service-banners .h-more-wrap{ text-align:center; margin-top:48px; }
    #h-service-banners .h-load-more{
      font-family:inherit; display:inline-flex; align-items:center; gap:10px;
      padding:15px 56px; border-radius:50px; border:1.5px solid var(--bnz-blue);
      background:#fff; color:var(--bnz-blue); font-size:15px; font-weight:600; cursor:pointer;
      transition:background .25s ease, color .25s ease, box-shadow .25s ease;
    }
    #h-service-banners .h-load-more:hover{ background:var(--bnz-blue); color:#fff; box-shadow:0 12px 26px rgba(28,78,216,.28); }
    #h-service-banners .h-load-more .lm-arrow{ font-size:11px; }
    #h-service-banners .h-load-more[hidden]{ display:none; }

    /* ✅ 썸네일은 각 카드의 data-thumb 속성에서 설정합니다 (HTML 카드 목록 참고) */

    @media (max-width:980px){
      #h-service-banners .h-banner-wrapper{ grid-template-columns:repeat(2,1fr); }
      #h-service-banners .h-main-title{ font-size:26px; }
      #h-service-banners .h-dummy-title{ font-size:22px; }
    }
    @media (max-width:600px){
      #h-service-banners .h-banner-wrapper{ grid-template-columns:1fr; }
      #h-service-banners .h-banner{ min-height:360px; }
      #h-service-banners .h-banner-text{ font-size:15px; }
      #h-service-banners .h-load-more{ padding:14px 44px; }
    }
    @media (prefers-reduced-motion:reduce){
      #h-service-banners .h-banner,
      #h-service-banners .h-banner::before,
      #h-service-banners .h-more .arrow{ transition:none !important; }
    }
  </style>

  <script>
    (function(){
      var root = document.getElementById('h-service-banners');
      if(!root) return;

      /* 썸네일 적용 : 각 카드의 data-thumb 값 → 배경 이미지 */
      Array.prototype.forEach.call(root.querySelectorAll('.h-banner[data-thumb]'), function(card){
        var src = (card.getAttribute('data-thumb') || '').trim();
        if(src) card.style.setProperty('--h-bg', 'url("' + src.replace(/"/g,'%22') + '")');
      });

      var STEP = 12; /* 처음 노출 개수 = 클릭당 추가 노출 개수 */
      var cards = Array.prototype.slice.call(root.querySelectorAll('.h-banner'));
      var moreBtn = root.querySelector('#h-load-more-btn');
      var shown = STEP;

      function render(){
        cards.forEach(function(card, i){
          card.style.display = (i < shown) ? '' : 'none';
        });
        if(moreBtn) moreBtn.hidden = !(cards.length > shown);
      }

      if(moreBtn){
        moreBtn.addEventListener('click', function(){
          shown += STEP;
          render();
        });
      }

      render();
    })();
  </script>
</section>
